name: Release

# Pushing a vX.Y.Z tag builds both apps, signs them with the release key and
# publishes a GitHub Release. Obtainium follows these releases for the phone
# app. It needs the RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD and
# RELEASE_KEY_ALIAS repository secrets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The tag names the release; gradle.properties sets the versions built.
      # They must agree, or the APKs would carry a different version than the
      # release Obtainium sees.
      - name: Check the tag matches pluralware.version
        run: |
          version=$(sed -n 's/^pluralware\.version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pluralware.version=$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Without the key the build would succeed unsigned, so refuse early.
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 isn't set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PLURALWARE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          PLURALWARE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          PLURALWARE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew test :mobile:assembleRelease :wear:assembleRelease --console=plain

      # Both APKs must carry the same certificate, or the Data Layer won't
      # connect them. The fingerprint goes in the release notes so users can
      # check what they installed.
      - name: Collect and verify the APKs
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          mkdir dist
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/pluralware-mobile-$VERSION.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "dist/pluralware-wear-$VERSION.apk"
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' > "$apk.cert"
          done
          if ! cmp -s "dist/pluralware-mobile-$VERSION.apk.cert" "dist/pluralware-wear-$VERSION.apk.cert"; then
            echo "::error::The phone and watch APKs are signed with different certificates"
            exit 1
          fi
          fingerprint=$(cat "dist/pluralware-mobile-$VERSION.apk.cert")
          rm dist/*.cert
          (cd dist && sha256sum *.apk > SHA256SUMS)
          {
            echo "Install \`pluralware-mobile-$VERSION.apk\` on your phone and \`pluralware-wear-$VERSION.apk\` on your watch."
            echo
            echo "Signing certificate SHA-256: \`$fingerprint\`"
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PluralWare $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
