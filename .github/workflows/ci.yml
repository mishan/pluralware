name: CI

# Changes that can't affect the Android build don't run it: prose, and the
# web receiver and relay, which have their own workflows.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "web-receiver/**", "relay/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "web-receiver/**", "relay/**"]

# A newer push to the same branch or PR supersedes a run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and checks the committed wrapper jar against Gradle's
      # published checksums before anything runs it. Only runs on main write
      # the cache; pull requests restore main's (dependencies, the Gradle
      # distribution, and build-cache entries for unchanged work).
      - uses: gradle/actions/setup-gradle@v6

      # The gate: unit tests and lint for every module, and debug and release
      # (R8) builds of both apps. That's `./gradlew build` without the
      # baseline-profile machinery (:baselineprofile and the benchmark and
      # non-minified variants it adds), which is a third of the tasks and
      # none of the checks. The runner image ships the Android SDK and sets
      # ANDROID_HOME, so no local.properties is needed.
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --console=plain

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore
